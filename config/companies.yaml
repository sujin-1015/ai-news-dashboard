# 기업 사전: 업종 → 기업 목록
# - name: 화면에 보일 대표 이름
# - aliases: 기사에서 찾을 별칭 (매칭 규칙은 taxonomy.yaml 상단 설명과 같다)
# - exclude: 이 문구는 지우고 매칭 (예: "카카오" 사전에서 "카카오뱅크"를 지워서 중복 매칭 방지)
# 기업이 매칭되면 그 업종도 기사에 자동으로 붙는다.
# 너무 일반적인 단어(우리, 하나, 삼성, LG, SK, 현대 단독)는 별칭으로 쓰지 말 것 → 오분류 원인

