# 업종 / 주제 분류 사전 (키워드 규칙 기반, LLM 호출 없음)
#
# 매칭 규칙 (collector/classify.py)
# - 제목 + 요약에서 찾는다. 한 기사가 여러 분류에 속할 수 있다.
# - 한글 키워드: 부분 문자열 매칭 ("반도체" → "반도체주"도 매칭)
# - 영문/숫자 키워드: 앞뒤가 영문·숫자가 아닐 때만 매칭, 대소문자 무시
#   ("AI" → "AI반도체" O, "OPENAI"는 X / "KB" → "KB국민" O, "KBS" X)
# - exclude: 이 문구가 있으면 그 부분을 지우고 매칭 (오분류 방지)
# - 기업 사전(companies.yaml)에서 기업이 매칭되면 그 기업의 업종도 자동으로 붙는다.
# - 업종이 하나도 없으면 주제의 fallback_industry(예: AI 기사 → IT), 그래도 없으면 "기타"
#
# 오분류를 발견하면: 화면의 기사 카드 → "분류 근거"에서 어떤 키워드 때문인지 확인 →
# 여기서 키워드를 빼거나 exclude에 추가 → `python scripts/run_local.py`로 재확인

industries:
  금융:
    keywords: [은행, 금융사, 금융권, 금융지주, 카드사, 신용카드, 보험사, 생명보험, 손해보험, 보험업, 증권사, 증권가,
               자산운용, 핀테크, 인터넷은행, 인터넷전문은행, 저축은행, 대출, 예금, 가상자산, 가상화폐, 스테이블코인,
               지급결제, 간편결제, 마이데이터, 금융당국, 금융보안, 디지털금융, 토큰증권, STO,
               코스피, 코스닥, 증시, 주식시장, 펀드, 퇴직연금, 금리, 환율, 공매도]
    exclude: [혈액은행, 푸드뱅크, 정자은행]
  IT:
    keywords: [소프트웨어, SW, 클라우드, SaaS, 데이터센터, IDC, 통신사, 이동통신, 이통사, 이통3사, 포털, 게임사,
               IT서비스, 빅테크, 플랫폼 기업, 스타트업, 오픈소스, 개발자, 앱 마켓, 앱마켓, 메신저, 검색엔진,
               게임, 지스타, e스포츠, AI 기업, AI기업, AI 스타트업, AI 서비스, AI 플랫폼, 이커머스, 디지털 전환, DX]
  제조:
    keywords: [제조업, 제조사, 스마트팩토리, 스마트 팩토리, 반도체, 파운드리, 디스플레이, 배터리, 이차전지, 2차전지,
               완성차, 자동차, 전기차, 철강, 조선업, 조선사, 석유화학, 가전, 부품사, 신소재, 양산, 생산라인,
               스마트폰, 폴더블, 생산공장, 공장 증설, 공장 가동]
    exclude: [국가전략, 국가전산, 국가전력]   # '가전' 오매칭 방지
  공공:
    keywords: [공공기관, 공공부문, 공공 부문, 공공 SW, 공공SW, 지자체, 지방자치단체, 정부부처, 중앙부처, 행정기관,
               전자정부, 디지털플랫폼정부, 조달청, 국회, 공공데이터, 공공 클라우드, 국가기관]
    # 정부·공공 피드(kind: gov)에서 온 기사는 자동으로 "공공"

topics:
  # group은 화면에서 주제를 묶어 보여줄 때 쓴다.
  AI 일반:
    fallback_industry: IT   # 업종이 하나도 없을 때만 IT로
    group: 신기술
    keywords: [AI, 인공지능, 머신러닝, 딥러닝, 에이아이, 에이전트, 디지털 트윈, 디지털트윈]
  생성형AI:
    fallback_industry: IT   # 업종이 하나도 없을 때만 IT로
    group: 신기술
    keywords: [생성형 AI, 생성형AI, 생성AI, 생성 AI, 챗GPT, ChatGPT, 제미나이, Gemini, 클로드, Claude, 코파일럿, Copilot,
               AI 에이전트, AI에이전트, 에이전틱, 멀티모달, 이미지 생성, 영상 생성, 그록, Grok]
  LLM:
    fallback_industry: IT   # 업종이 하나도 없을 때만 IT로
    group: 신기술
    keywords: [LLM, sLLM, 거대언어모델, 대규모 언어모델, 대규모언어모델, 대형언어모델, 대형 언어모델, 언어모델, 파운데이션 모델,
               파운데이션모델, 추론 모델, 추론모델, 하이퍼클로바, 엑사원, EXAONE, 독자 AI, 소버린 AI, 소버린AI, GPT]
  반도체/GPU:
    group: 신기술
    keywords: [반도체, GPU, HBM, NPU, TPU, 파운드리, D램, DRAM, 낸드, NAND, AI 가속기, AI칩, AI 칩, 웨이퍼, 메모리]
  로봇:
    group: 신기술
    keywords: [로봇, 휴머노이드, 피지컬 AI, 피지컬AI, 로보틱스, 자율주행, 드론]
  클라우드/데이터센터:
    fallback_industry: IT   # 업종이 하나도 없을 때만 IT로
    group: 신기술
    keywords: [클라우드, 데이터센터, SaaS, IDC, 멀티클라우드, 하이브리드 클라우드, CSP]
  양자:
    fallback_industry: IT   # 업종이 하나도 없을 때만 IT로
    group: 신기술
    keywords: [양자컴퓨터, 양자 컴퓨터, 양자컴퓨팅, 양자 컴퓨팅, 양자암호, 양자내성암호, PQC]
  보안:
    fallback_industry: IT   # 업종이 하나도 없을 때만 IT로
    group: 보안
    keywords: [보안, 정보보호, 사이버, 제로트러스트, 제로 트러스트, 취약점, 보안 업데이트, CVE, 인증서, 본인인증, 다중인증, MFA, 암호화, 보안관제, ISMS, 보안 공시, 정보보호 공시]
    # '보안관'(경비원)만 빼고 '보안관리'·'보안관제'는 살린다
    exclude: [학교보안관, 보안관이, 보안관은, 보안관을, 보안관들, 보안관과, 보안요원]
  해킹·유출:
    fallback_industry: IT   # 업종이 하나도 없을 때만 IT로
    group: 보안
    keywords: [해킹, 해커, 유출, 랜섬웨어, 침해사고, 침해 사고, 피싱, 스미싱, 보이스피싱, 악성코드, 디도스, DDoS,
               사이버공격, 사이버 공격, 탈취, 정보 유출, 개인정보 유출, 다크웹]
  규제·정책:
    group: 정책
    keywords: [규제, 법안, 개정안, 시행령, 가이드라인, 입법, AI기본법, AI 기본법, 인공지능기본법, 정보통신망법, 개인정보보호법,
               과징금, 제재, 의무화, 금융당국, 공정위, 공정거래위원회, 국정과제, 정책]
  투자·실적:
    group: 경제
    keywords: [실적, 매출, 영업이익, 순이익, 분기, 상장, IPO, 투자 유치, 투자유치, 시리즈A, 시리즈B, 시리즈C, 펀딩,
               인수, M&A, 합병, 주가, 시가총액, 시총, 어닝]
  채용·인재:
    group: 커리어
    keywords: [채용, 공채, 신입사원, 신입 사원, 인턴, 인재 양성, 인재양성, 부트캠프, 교육생 모집, 취업]
