# 테스트 → (main 푸시일 때) CDK 배포
# - AWS 장기 액세스 키를 저장소에 두지 않는다. GitHub OIDC 토큰으로 IAM 역할을 assume (임시 자격 증명 1시간).
# - 필요한 설정 (Settings → Secrets and variables → Actions)
#     Variables: AWS_DEPLOY_ROLE_ARN  (AiNewsGithubOidc 스택 출력값)
#     Secrets:   ALERT_EMAIL          (예산 알림 메일, 로그에 마스킹됨)
name: test-and-deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # 배포 도중 취소되지 않게

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    # 배포 역할(ARN)을 등록하기 전에는 테스트만 돌고 배포는 건너뛴다
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # 주의: environment를 지정하면 OIDC 토큰의 sub가 'repo:…:environment:이름'으로 바뀌어
    #       IAM 신뢰 조건(ref:refs/heads/main)과 맞지 않게 된다. 쓰려면 신뢰 조건도 함께 바꿀 것.
    permissions:
      id-token: write  # OIDC 토큰 발급에 필요
      contents: read
    env:
      AWS_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: pip install -r infra/requirements.txt
      - run: npm ci

      # 공개 저장소의 Actions 로그는 누구나 볼 수 있다. 계정 ID는 Variable이라 자동 마스킹되지 않고,
      # 아래 단계의 입력값(role-to-assume)이 로그에 그대로 찍히므로 미리 마스킹한다.
      - name: 로그 마스킹 (계정 ID)
        env: { ROLE_ARN: "${{ vars.AWS_DEPLOY_ROLE_ARN }}" }
        run: |
          echo "::add-mask::$(echo "$ROLE_ARN" | cut -d: -f5)"

      - name: AWS 자격 증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}
          mask-aws-account-id: true  # 공개 저장소 로그에 계정 ID가 보이지 않게

      - name: 변경 미리보기 (cdk diff)
        working-directory: infra
        env: { ALERT_EMAIL: "${{ secrets.ALERT_EMAIL }}" }
        run: npx cdk diff AiNewsDashboard

      - name: 배포 (cdk deploy)
        working-directory: infra
        env: { ALERT_EMAIL: "${{ secrets.ALERT_EMAIL }}" }
        # 스택 출력(대시보드·챗봇 API 주소)과 계정 ID가 공개 로그에 남지 않게 걸러서 출력한다
        run: |
          set -o pipefail
          npx cdk deploy AiNewsDashboard --require-approval never 2>&1 | sed -u -E \
            -e 's/[a-z0-9]+\.cloudfront\.net/***.cloudfront.net/g' \
            -e 's/[a-z0-9]+\.execute-api\./***.execute-api./g' \
            -e 's/(^|[^0-9])[0-9]{12}([^0-9]|$)/\1************\2/g'
